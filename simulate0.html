        @media (max-width: 700px) {

    <script>
        // ===== 自訂元件（需在場景解析前註冊） =====
        AFRAME.registerComponent('billboard', {
            tick: function () {
                const cam = this.el.sceneEl.camera;
                if (!cam) return;
                const v = new THREE.Vector3();
                cam.getWorldPosition(v);
                this.el.object3D.lookAt(v);
            }
        });
        AFRAME.registerComponent('game', {
            tick: function (time, dt) { if (window.gameTick) window.gameTick(Math.min(dt / 1000, 0.1)); }

<body>

<div id="modal-bg"><div id="modal"></div></div>

<a-scene game renderer="antialias: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable" fog="type: exponential; color: #222; density: 0" vr-mode-ui="enabled: true" loading-screen="dotsColor: #ffc107; backgroundColor: #111">
    <a-entity id="amb" light="type: ambient; intensity: 0.75; color: #fff"></a-entity>
    <a-entity id="sun" light="type: directional; intensity: 0.6" position="-10 30 20"></a-entity>
    <a-sky id="sky" color="#1b2735"></a-sky>
    <a-entity id="world"></a-entity>
    <a-entity id="rig" position="0 0 0">
        <a-entity id="cam" camera look-controls="pointerLockEnabled: false" position="0 1.6 0"></a-entity>
    </a-entity>

<script>
// ================= 工具 =================
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const smooth = (t, a, b) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const world = $('world'), rigEl = $('rig'), camEl = $('cam'), sceneEl = document.querySelector('a-scene');
let solids = [];   // {x0,x1,z0,z1,yb,yt}

function ent(tag, attrs = {}, parent = world) {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    parent.appendChild(e);
    return e;
}
function box(x, y, z, w, h, d, color, o = {}) {
    const e = ent('a-box', { position: `${x} ${y + h / 2} ${z}`, width: w, height: h, depth: d }, o.parent || world);
    const mat = { color, opacity: o.opacity ?? 1, transparent: (o.opacity ?? 1) < 1 };
    if (o.flat) mat.shader = 'flat';
    if (o.side) mat.side = o.side;
    e.setAttribute('material', mat);
    if (o.cls) e.setAttribute('class', o.cls);
    if (o.data) Object.entries(o.data).forEach(([k, v]) => e.setAttribute('data-' + k, v));
    if (o.solid !== false) solids.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, yb: y, yt: y + h });
    return e;
}
function labelCanvas(text, o = {}) {
    const W = o.w || 512, H = o.h || 128;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, W, H); }
    if (o.border) { g.strokeStyle = o.border; g.lineWidth = 8; g.strokeRect(4, 4, W - 8, H - 8); }
    g.fillStyle = o.fg || '#fff';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = String(text).split('\n');
    const fs = o.font || Math.min(64, H / lines.length * 0.7);
    g.font = `bold ${fs}px "Microsoft JhengHei", "PingFang TC", sans-serif`;
    lines.forEach((ln, i) => g.fillText(ln, W / 2, H / 2 + (i - (lines.length - 1) / 2) * fs * 1.15));
    return c;
}
function label(text, x, y, z, w, h, o = {}) {
    const e = ent('a-plane', { position: `${x} ${y} ${z}`, rotation: `0 ${o.rot || 0} 0`, width: w, height: h }, o.parent || world);
    e.setAttribute('material', { shader: 'flat', src: labelCanvas(text, { w: o.cw || 512, h: o.ch || Math.round(512 * h / w), bg: o.bg, fg: o.fg, font: o.font, border: o.border }), transparent: !o.bg, side: 'double' });
    if (o.billboard) e.setAttribute('billboard', '');
    if (o.cls) e.setAttribute('class', o.cls);
    if (o.data) Object.entries(o.data).forEach(([k, v]) => e.setAttribute('data-' + k, v));
    return e;
}
// 牆：沿 x 方向（位於 z）／沿 z 方向（位於 x），gaps 為開口區間
function wallX(z, x0, x1, h, color, gaps = []) {
    let cur = x0;
    gaps.slice().sort((a, b) => a[0] - b[0]).forEach(([a, b]) => {
        if (a > cur) box((cur + a) / 2, 0, z, a - cur, h, 0.3, color);
        if (h > 2.3) box((a + b) / 2, 2.3, z, b - a, h - 2.3, 0.3, color);
        cur = b;
    });
    if (x1 > cur) box((cur + x1) / 2, 0, z, x1 - cur, h, 0.3, color);
}
function wallZ(x, z0, z1, h, color, gaps = []) {
    let cur = z0;
    gaps.slice().sort((a, b) => a[0] - b[0]).forEach(([a, b]) => {
        if (a > cur) box(x, 0, (cur + a) / 2, 0.3, h, a - cur, color);
        if (h > 2.3) box(x, 2.3, (a + b) / 2, 0.3, h - 2.3, b - a, color);
        cur = b;
    });
    if (z1 > cur) box(x, 0, (cur + z1) / 2, 0.3, h, z1 - cur, color);
}
function floor(x, z, w, d, color, y = 0) { return box(x, y - 0.05, z, w, 0.05, d, color, { solid: false }); }
function exitSign(x, y, z, rot, dark = false, o = {}) {
    return label(dark ? '🏃 EXIT 出口' : '🏃 EXIT 出口', x, y, z, 1.1, 0.38, { rot, bg: dark ? '#3d4a3d' : '#1e8449', fg: dark ? '#6b776b' : '#fff', ...o });
}
function dirSign(text, x, y, z, rot, o = {}) {
    return label(text, x, y, z, 0.8, 0.28, { rot, bg: '#1e8449', fg: '#fff', ...o });
}
function stairRoom(cx, cz, axis, name) {
    // 安全梯間：門外的小房間（axis: 'z+' 表示往 +z 延伸）
    const d = 3;
    if (axis === 'z+') { floor(cx, cz + d / 2, 3, d, '#8d8d8d'); wallZ(cx - 1.5, cz, cz + d, 3, '#9aa'); wallZ(cx + 1.5, cz, cz + d, 3, '#9aa'); wallX(cz + d, cx - 1.5, cx + 1.5, 3, '#9aa'); label(name, cx, 2.2, cz + d - 0.2, 1.6, 0.5, { rot: 180, bg: '#1e8449' }); }
    if (axis === 'x-') { floor(cx - d / 2, cz, d, 3, '#8d8d8d'); wallX(cz - 1.5, cx - d, cx, 3, '#9aa'); wallX(cz + 1.5, cx - d, cx, 3, '#9aa'); wallZ(cx - d, cz - 1.5, cz + 1.5, 3, '#9aa'); label(name, cx - d + 0.2, 2.2, cz, 1.6, 0.5, { rot: 90, bg: '#1e8449' }); }
    if (axis === 'x+') { floor(cx + d / 2, cz, d, 3, '#8d8d8d'); wallX(cz - 1.5, cx, cx + d, 3, '#9aa'); wallX(cz + 1.5, cx, cx + d, 3, '#9aa'); wallZ(cx + d, cz - 1.5, cz + 1.5, 3, '#9aa'); label(name, cx + d - 0.2, 2.2, cz, 1.6, 0.5, { rot: -90, bg: '#1e8449' }); }
}

// ================= 設備外觀 =================
function equipVisual(eq) {
    const [x, y, z] = eq.p, r = eq.rot || 0;
    const o = { cls: 'clickable', data: { eq: eq.id }, solid: false };
    const lo = { cls: 'clickable', data: { eq: eq.id } };
    switch (eq.kind) {
        case 'smoke': ent('a-cylinder', { position: `${x} ${y - 0.04} ${z}`, radius: 0.15, height: 0.08, color: '#f5f5f5', class: 'clickable', 'data-eq': eq.id }); break;
        case 'sprinkler':
            ent('a-cone', { position: `${x} ${y - 0.08} ${z}`, 'radius-bottom': 0.09, 'radius-top': 0.02, height: 0.14, color: '#bdc3c7', class: 'clickable', 'data-eq': eq.id });
            ent('a-sphere', { position: `${x} ${y - 0.17} ${z}`, radius: 0.03, color: '#e74c3c', class: 'clickable', 'data-eq': eq.id }); break;
        case 'hydrant':
            box(x, y, z, r % 180 === 0 ? 0.8 : 0.25, 1.1, r % 180 === 0 ? 0.25 : 0.8, '#c0392b', o);
            label('消防栓', x + (r === 90 ? 0.14 : r === -90 ? -0.14 : 0), y + 0.8, z + (r === 0 ? 0.14 : r === 180 ? -0.14 : 0), 0.6, 0.2, { rot: r, bg: '#c0392b', ...lo }); break;
        case 'extinguisher':
            ent('a-cylinder', { position: `${x} ${y + 0.3} ${z}`, radius: 0.1, height: 0.55, color: '#e74c3c', class: 'clickable', 'data-eq': eq.id });
            ent('a-cylinder', { position: `${x} ${y + 0.62} ${z}`, radius: 0.04, height: 0.1, color: '#222', class: 'clickable', 'data-eq': eq.id }); break;
        case 'exit': exitSign(x, y, z, r, false, lo); break;
        case 'dir': dirSign(eq.text, x, y, z, r, lo); break;
        case 'emlight':
            box(x, y - 0.12, z, 0.45, 0.12, 0.15, '#fafafa', o);
            ent('a-sphere', { position: `${x - 0.12} ${y - 0.16} ${z + 0.08}`, radius: 0.05, color: '#fff59d', class: 'clickable', 'data-eq': eq.id });
            ent('a-sphere', { position: `${x + 0.12} ${y - 0.16} ${z + 0.08}`, radius: 0.05, color: '#fff59d', class: 'clickable', 'data-eq': eq.id }); break;
        case 'vent': box(x, y - 0.12, z, eq.size || 1.2, 0.12, eq.size ? eq.size * 0.7 : 0.8, '#455a64', o); break;
        case 'foam':
            ent('a-cone', { position: `${x} ${y - 0.1} ${z}`, 'radius-bottom': 0.14, 'radius-top': 0.04, height: 0.18, color: '#f1c40f', class: 'clickable', 'data-eq': eq.id }); break;
        case 'speaker':
            box(x, 0, z, 0.12, y, 0.12, '#7f8c8d', { solid: false });
            ent('a-cylinder', { position: `${x} ${y + 0.2} ${z}`, radius: 0.25, height: 0.4, color: '#34495e', class: 'clickable', 'data-eq': eq.id }); break;
        case 'beam':
            box(x - 30, y, z, 0.6, 0.4, 0.4, '#ecf0f1', o); box(x + 30, y, z, 0.6, 0.4, 0.4, '#ecf0f1', o);
            box(x, y + 0.18, z, 60, 0.04, 0.04, '#e74c3c', { ...o, opacity: 0.6, flat: true }); break;
        case 'info':
            box(x, 0, z, 0.1, 1.4, 0.1, '#7f8c8d', { solid: false });
            label('ℹ️ 疏散時間目標', x, 1.7, z, 1.6, 0.5, { bg: '#2c3e50', billboard: true, ...lo }); break;
        case 'panel': break;   // 由幾何本身（防火捲門、防煙垂壁）提供點擊
    }
}

// ================= 區域資料 =================
const ZONES = {};

// ---------- L1 通道商場 ----------
ZONES.L1 = {
    name: 'L1 避難通道與商場', sky: '#1b2735', ext: [-26, 24, -8, 8],
    start: { tour: [16, 0, 90], inspect: [16, 0, 90], evac: [16, 1.2, 90] },
    build(mode) {
        floor(0, 0, 40.6, 8.6, '#cfcfcf');
        floor(-23, 0, 6, 10, '#9e9d89');
        label('戶外廣場', -24, 2.5, 0, 2, 0.6, { rot: 90, bg: '#2c3e50' });
        box(0, 4.5, 0, 40, 0.1, 8, '#ececec', { solid: false });
        wallX(-4, -20, 20, 4.5, '#b9b9b9');
        wallX(4, -20, 20, 4.5, '#c8c8c8', [[-12.6, -11.4], [13.4, 14.6]]);
        wallZ(-20, -4, 4, 4.5, '#b0bec5', [[-1.5, 1.5]]);
        wallZ(20, -4, 4, 4.5, '#b0bec5');
        label('往巨蛋本體 →（門已關閉）', 19.8, 2.4, 0, 3, 0.5, { rot: -90, bg: '#34495e' });
        // 商店
        [[-15, '咖啡館', '#8d6e63'], [-8, '服飾店', '#5c6bc0'], [3, '書店', '#26a69a'], [10, '餐廳', '#ef6c00'], [16, '運動用品', '#c62828']].forEach(([sx, n, c]) => {
            box(sx, 0, -3.83, 5, 3, 0.04, '#81d4fa', { opacity: 0.45, solid: false });
            box(sx, 3, -3.8, 5, 0.6, 0.1, c, { solid: false });
            label(n, sx, 3.3, -3.73, 2.2, 0.5, { bg: c });
        });
        stairRoom(-12, 4, 'z+', '安全梯 S1');
        stairRoom(14, 4, 'z+', '安全梯 S2');
        // 防火捲門（捲門箱 + 動態門體）與旁邊的防火門
        box(-2, 3.9, -0.6, 0.4, 0.6, 6.8, '#7f8c8d', { solid: false, cls: 'clickable', data: { eq: 'L1-shutter' } });
        box(-2, 0, 2.78, 0.3, 4.5, 0.12, '#95a5a6');
        label('防火門', -2, 2.5, 3.4, 1.0, 0.3, { rot: 90, bg: '#7f8c8d' });
        const sh = box(-2, 0, -0.6, 0.12, 1, 6.8, '#90a4ae', { solid: false });
        sh.object3D.visible = false;
        this.shutter = { el: sh, bottom: 3.9, solid: { x0: -2.06, x1: -1.94, z0: -4, z1: 2.8, yb: 3.9, yt: 4.5 } };
        solids.push(this.shutter.solid);
        // 防火門門扇（平時關閉但可推開通行；檢查模式顯示被門檔撐開的 S1）
        if (mode !== 'inspect') box(-12, 0, 3.9, 1.2, 2.2, 0.05, '#a1887f', { solid: false, opacity: 0.85 });
        box(14, 0, 3.9, 1.2, 2.2, 0.05, '#a1887f', { solid: false, opacity: 0.85 });

// ================= 狀態 =================
const state = { zone: 'L1', mode: 'tour', keys: {}, crouch: false, modalOpen: false };
const progress = {};
Object.keys(ZONES).forEach(z => progress[z] = { visited: new Set(), quiz: {}, found: new Set(), wrong: 0, checked: new Set(), evac: [] });
let fire = null;      // 避難模式狀態
let smokeEls = [];

// ================= 建置區域 =================
function buildZone() {
    const Z = ZONES[state.zone], mode = state.mode;
    world.innerHTML = '';
    solids = [];
    smokeEls = [];
    Z.shutter = null;
    $('sky').setAttribute('color', Z.sky);
    Z.build(mode);

    const replaced = new Set(mode === 'inspect' ? Z.violations.filter(v => v.replaces).map(v => v.replaces) : []);
    Z.equipment.forEach(eq => {
        if (!replaced.has(eq.id)) equipVisual(eq);
        if (mode === 'tour') {
            const [x, y, z] = eq.p;
            const hy = y > 2.5 ? y - 0.7 : y + (eq.kind === 'exit' ? 0.5 : 1.0);
            const g = ent('a-entity', { position: `${x} ${hy} ${z}`, billboard: '' });
            const ring = ent('a-ring', { 'radius-inner': 0.17, 'radius-outer': 0.24, material: 'shader: flat; color: #ffc107', class: 'clickable', 'data-eq': eq.id }, g);
            ring.setAttribute('animation', 'property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: 900; loop: true');
            label('i', 0, 0, 0.01, 0.3, 0.3, { parent: g, fg: progress[state.zone].visited.has(eq.id) ? '#9e9e9e' : '#ffc107', font: 96, cw: 128, ch: 128, cls: 'clickable', data: { eq: eq.id } });
        }
    });
    if (mode === 'inspect') Z.violations.forEach(v => v.build());
    if (mode === 'evac') Z.violations.filter(v => v.evac).forEach(v => v.build());

    // 起點
    const [sx, sz, yaw] = Z.start[mode];
    rigEl.object3D.position.set(sx, 0, sz);
    rigEl.object3D.rotation.y = yaw * Math.PI / 180;
    const lc = camEl.components['look-controls'];
    if (lc && lc.yawObject) { lc.yawObject.rotation.y = 0; lc.pitchObject.rotation.x = 0; }
    state.crouch = false;
    camEl.object3D.position.y = 1.6;

    // 燈光與霧
    $('amb').setAttribute('light', { intensity: state.zone === 'B4' ? 0.6 : 0.75, color: '#fff' });
    sceneEl.setAttribute('fog', { type: 'exponential', color: '#222', density: 0 });
    fire = null;
    if (mode === 'evac') startFire();
    renderModeBox();
    renderProgress();
}

// ================= 避難體驗 =================
function startFire() {
    const Z = ZONES[state.zone], F = Z.fire;
    fire = { t: 0, exposure: 0, done: false, sprOn: false, lastFog: -1, layer: 99, inSmoke: false };
    const [fx, fy, fz] = F.p;
    const g = ent('a-entity', { position: `${fx} ${fy} ${fz}` });
    ent('a-cone', { 'radius-bottom': 0.9, 'radius-top': 0.05, height: 2.0, position: '0 1 0', material: 'shader: flat; color: #ff6d00; opacity: 0.9; transparent: true', animation: 'property: scale; from: 1 0.85 1; to: 1.1 1.15 1.1; dir: alternate; dur: 220; loop: true' }, g);
    ent('a-cone', { 'radius-bottom': 0.5, 'radius-top': 0.02, height: 1.3, position: '0 0.7 0', material: 'shader: flat; color: #ffd54f', animation: 'property: scale; from: 1 0.8 1; to: 1.05 1.2 1.05; dir: alternate; dur: 170; loop: true' }, g);
    ent('a-entity', { position: '0 1.5 0', light: 'type: point; color: #ff8f00; intensity: 2.2; distance: 14', animation: 'property: light.intensity; from: 1.6; to: 2.6; dir: alternate; dur: 140; loop: true' }, g);
    solids.push({ x0: fx - 1, x1: fx + 1, z0: fz - 1, z1: fz + 1, yb: 0, yt: 3 });
    if (F.block) solids.push(F.block);
    F.sections.forEach(s => {
        const e = box((s.x0 + s.x1) / 2, 0, (s.z0 + s.z1) / 2, s.x1 - s.x0, 1, s.z1 - s.z0, '#2b2b2b', { opacity: 0.72, solid: false, side: 'double' });
        e.object3D.visible = false;
        smokeEls.push({ e, s });
    });
    $('amb').setAttribute('light', { intensity: 0.32, color: '#ffd9b0' });
    showModal(`<h3>🔥 避難體驗：${Z.name}</h3><p>${F.intro}</p>
        <p>操作：<b>W/A/S/D</b> 或方向鍵移動、<b>Q/E</b> 或 ←/→ 轉向、滑鼠拖曳看四周、<b>C</b> 蹲低（手機使用左下角按鈕）。<br>右側會顯示煙層高度與「吸入濃煙」量，滿 100% 即失敗。</p>
        <div class="btn-row"><button class="btn" onclick="closeModal()">開始！</button></div>`);
}

function updateFire(dt) {
    if (!fire || fire.done || state.modalOpen) return;
    const Z = ZONES[state.zone], F = Z.fire;
    fire.t += dt;
    const p = rigEl.object3D.position;
    const head = camEl.object3D.position.y;

    // 防火捲門
    if (Z.shutter && F.shutter) {
        const k = clamp((fire.t - F.shutter.start) / F.shutter.dur, 0, 1);
        const b = 3.9 * (1 - k);
        Z.shutter.bottom = b;
        Z.shutter.solid.yb = b;
        const el = Z.shutter.el.object3D;
        el.visible = k > 0;
        el.scale.y = 4.5 - b;
        el.position.y = b + (4.5 - b) / 2;
        if (k > 0 && !fire.shutterMsg) { fire.shutterMsg = true; toast('偵煙連動：防火捲門開始降下！'); }
    }
    // 撒水
    if (F.sprinklers && !fire.sprOn && fire.t > 8) {
        fire.sprOn = true;
        F.sprinklers.forEach(([sx, sz]) => ent('a-cylinder', { position: `${sx} 2.25 ${sz}`, radius: 1.2, height: 4.4, 'open-ended': true, material: 'color: #81d4fa; opacity: 0.18; transparent: true; side: double' }));
        toast('撒水頭動作！');
    }
    // 煙層
    let layer = 99;
    smokeEls.forEach(({ e, s }) => {
        const L = s.layer(fire.t);
        const h = s.top - L;
        e.object3D.visible = h > 0.05;
        e.object3D.scale.y = Math.max(h, 0.01);
        e.object3D.position.y = L + h / 2;
        if (p.x >= s.x0 && p.x <= s.x1 && p.z >= s.z0 && p.z <= s.z1) layer = Math.min(layer, L);
    });
    fire.layer = layer;
    // 暴露量：頭部在煙層中 + 靠近火源的輻射熱
    let rate = 0;
    if (head > layer) rate += 4 + 4 * clamp((head - layer) / 1.0, 0, 1);
    const d = Math.hypot(p.x - F.p[0], p.z - F.p[2]);
    if (d < F.heatR) rate += 14 * (1 - d / F.heatR);
    fire.exposure = clamp(fire.exposure + rate * dt, 0, 100);
    fire.inSmoke = head > layer;
    // 霧（能見度）
    const fog = head > layer ? 0.2 : (layer - head < 0.6 ? 0.06 : (layer < 10 ? 0.015 : 0));
    if (Math.abs(fog - fire.lastFog) > 0.004) { fire.lastFog = fog; sceneEl.setAttribute('fog', { type: 'exponential', color: '#262626', density: fog }); }

    // 出口判定
    const ex = Z.exits.find(e => e.test(p.x, p.z));
    if (ex) return endEvac(true, ex.name);
    if (fire.exposure >= 100) return endEvac(false);
    if (state.zone === 'B4' && p.x > 18.5 && p.z > 2 && p.z < 6 && !fire.rampMsg) { fire.rampMsg = true; toast('車道不是避難路線，請改走安全梯！'); }
}

function endEvac(ok, exitName) {
    fire.done = true;
    const pr = progress[state.zone];
    const rec = { ok, time: Math.round(fire.t), exposure: Math.round(fire.exposure), exit: exitName || '—' };
    pr.evac.push(rec);
    renderProgress();
    const grade = !ok ? '' : rec.exposure < 25 ? '🏅 優良：幾乎沒有吸入濃煙' : rec.exposure < 60 ? '👍 及格：有吸入一些濃煙，下次記得更早蹲低' : '⚠️ 驚險：吸入大量濃煙';
    showModal(ok
        ? `<h3>✅ 成功避難！</h3><p>出口：<b>${exitName}</b><br>用時：<b>${rec.time} 秒</b>　吸入濃煙：<b>${rec.exposure}%</b><br>${grade}</p>${evacLesson()}<div class="btn-row"><button class="btn" onclick="restartZone()">再試一次</button><button class="btn secondary" onclick="closeModal()">關閉</button></div>`
        : `<h3>❌ 避難失敗</h3><p>你吸入了過多濃煙（或太靠近火源）。實際火災中，濃煙才是造成傷亡的主因。</p>${evacLesson()}<div class="btn-row"><button class="btn" onclick="restartZone()">再試一次</button></div>`);
}
function evacLesson() {
    const L = {
        L1: '重點：①最近的出口不一定能用（S2 被雜物堵住——這正是公安檢查要找的缺失）②防火捲門降下後走旁邊的防火門 ③越過捲門後的另一個防火區劃，煙會少很多。',
        B4: '重點：①不要為了「最近」而經過起火車輛 ②防煙垂壁另一側的煙比較少、比較晚下降 ③車道不是避難路線，應走安全梯。',
        B2: '重點：①大空間的煙會先往上累積，爭取了避難時間 ②被火封住的出口要放棄，改走其他通道 ③依廣播與出口標示燈分散前往各通道。'
    };
    return `<p style="font-size:0.85rem;color:#ffc107;">${L[state.zone]}</p>`;
}

// ================= 移動與碰撞 =================
function isBlocked(x, z) {
    const r = 0.3, head = camEl.object3D.position.y;
    return solids.some(s => s.yb < head + 0.05 && s.yt > 0.25 && x > s.x0 - r && x < s.x1 + r && z > s.z0 - r && z < s.z1 + r);
}
function move(dt) {
    if (state.modalOpen) return;
    const k = state.keys;
    const rig = rigEl.object3D;
    const turn = (k.KeyQ || k.ArrowLeft ? 1 : 0) - (k.KeyE || k.ArrowRight ? 1 : 0);
    rig.rotation.y += turn * 1.8 * dt;
    const fwd = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
    const str = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0);
    // 蹲低高度
    const cy = camEl.object3D.position;
    cy.y += ((state.crouch ? 0.9 : 1.6) - cy.y) * Math.min(1, dt * 8);
    if (!fwd && !str) return;
    const yaw = rig.rotation.y + camEl.object3D.rotation.y;
    const speed = (state.crouch ? 0.9 : (state.mode === 'evac' ? 1.6 : 3)) * dt;
    const n = Math.hypot(fwd, str);
    const dx = (-Math.sin(yaw) * fwd + Math.cos(yaw) * str) / n * speed;
    const dz = (-Math.cos(yaw) * fwd - Math.sin(yaw) * str) / n * speed;
    const p = rig.position;
    if (!isBlocked(p.x + dx, p.z + dz)) { p.x += dx; p.z += dz; }
    else if (!isBlocked(p.x + dx, p.z)) p.x += dx;
    else if (!isBlocked(p.x, p.z + dz)) p.z += dz;
}

window.addEventListener('keydown', e => {
    if (e.code === 'Escape') { closeModal(); return; }
    if (state.modalOpen) return;
    if (e.code === 'KeyC') { setCrouch(!state.crouch); return; }
    state.keys[e.code] = true;
    if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { state.keys[e.code] = false; });
document.querySelectorAll('#pad [data-key]').forEach(b => {
    const k = b.dataset.key;
    const on = e => { e.preventDefault(); state.keys[k] = true; };
    const off = e => { e.preventDefault(); state.keys[k] = false; };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off);
    b.addEventListener('pointercancel', off);
});
function setCrouch(v) { state.crouch = v; $('btnCrouch').classList.toggle('on', v); }
$('btnCrouch').addEventListener('click', () => setCrouch(!state.crouch));

// ================= 點擊互動 =================
sceneEl.addEventListener('click', e => {
    if (state.modalOpen) return;
    const t = e.target;
    if (!t || !t.getAttribute) return;
    const vid = t.getAttribute('data-vid'), eqId = t.getAttribute('data-eq');
    const Z = ZONES[state.zone], pr = progress[state.zone];
    if (state.mode === 'inspect') {
        if (vid) {
            const v = Z.violations.find(x => x.id === vid);
            const first = !pr.found.has(vid);
            pr.found.add(vid);
            showModal(`<h3>🔍 發現缺失！</h3><span class="tag">${v.cat}</span><p><b>${v.name}</b></p><p>改善方式：${v.fix}</p>
                ${first ? '' : '<p class="src">（此項已記錄過）</p>'}<div class="btn-row"><button class="btn" onclick="closeModal()">繼續檢查</button></div>`);
        } else if (eqId) {
            const eq = Z.equipment.find(x => x.id === eqId);
            pr.checked.add(eqId);
            toast(`✔ ${eq.name}：檢查正常`, true);
        }
        renderModeBox(); renderProgress();
        return;
    }
    if (state.mode === 'tour' && eqId) openEquip(eqId);
});

function openEquip(id) {
    const Z = ZONES[state.zone], eq = Z.equipment.find(x => x.id === id), pr = progress[state.zone];
    pr.visited.add(id);
    let html = `<h3>${eq.name}</h3>${eq.fact ? '<span class="tag">📌 查證資料</span>' : ''}<p>${eq.desc}</p>`;
    if (eq.src) html += `<p class="src">資料來源：${eq.src}</p>`;
    if (eq.quiz) {
        const ans = pr.quiz[id];
        html += `<p><b>📝 小測驗：</b>${eq.quiz.q}</p>` + eq.quiz.opts.map((o, i) => {
            const cls = ans == null ? '' : i === eq.quiz.a ? 'right' : i === ans ? 'wrong' : '';
            return `<button class="quiz-opt ${cls}" ${ans != null ? 'disabled' : ''} onclick="answerQuiz('${id}', ${i})">${o}</button>`;
        }).join('');
    }
    html += '<div class="btn-row"><button class="btn" onclick="closeModal()">關閉</button></div>';
    showModal(html);
    renderModeBox(); renderProgress();
}
window.answerQuiz = (id, i) => {
    const pr = progress[state.zone];
    if (pr.quiz[id] == null) pr.quiz[id] = i;
    openEquip(id);
    const eq = ZONES[state.zone].equipment.find(x => x.id === id);
    toast(i === eq.quiz.a ? '答對了！' : '答錯了，正確答案已標示為綠色。', i === eq.quiz.a);
};

// ================= 介面 =================
function showModal(html) { $('modal').innerHTML = html; $('modal-bg').style.display = 'block'; state.modalOpen = true; state.keys = {}; }
function closeModal() { $('modal-bg').style.display = 'none'; state.modalOpen = false; }
window.closeModal = closeModal;
window.restartZone = () => { closeModal(); buildZone(); };
$('modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg' && !(fire && !fire.done && fire.t === 0)) closeModal(); });

let toastTimer = null;
function toast(msg, ok = false) {
    const t = $('toast');
    t.textContent = msg; t.className = ok ? 'ok' : ''; t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.style.display = 'none', 2200);
}

function renderModeBox() {
    const Z = ZONES[state.zone], pr = progress[state.zone], m = state.mode;
    const box = $('modeBox');
    if (m === 'tour') {
        box.innerHTML = `<h4>🧭 導覽：${Z.name}</h4>點擊黃色 ⓘ 熱點查看設備說明並作答。<br>已瀏覽 <b>${pr.visited.size}/${Z.equipment.length}</b>`;
        $('hint').innerText = '🖱️ 拖曳畫面看四周 ｜ W/A/S/D 移動 ｜ 點擊 ⓘ 熱點 ｜ Esc 關閉視窗';
    } else if (m === 'inspect') {
        box.innerHTML = `<h4>🔍 公安檢查：${Z.name}</h4>本區藏有 <b>${Z.violations.length}</b> 項缺失。走動觀察並點擊有問題的物品；點到正常設備會顯示「檢查正常」。<br>已發現 <b>${pr.found.size}/${Z.violations.length}</b><div class="btn-row"><button class="btn" onclick="inspectReport()">📝 完成檢查</button></div>`;
        $('hint').innerText = '🔍 注意：防火門、出入口、捲門下方、撒水頭、滅火器、標示燈……';
    } else {
        box.innerHTML = `<h4>🔥 避難體驗：${Z.name}</h4>
            <div class="hud-row"><span>經過時間</span><b id="hTime">0 s</b></div>
            <div class="hud-row"><span>此處煙層高度</span><b id="hLayer">—</b></div>
            <div class="hud-row"><span>你的視線高度</span><b id="hHead">1.6 m</b></div>
            <div>吸入濃煙 <b id="hExpo">0%</b></div><div class="bar"><div id="hBar"></div></div>
            <div id="hWarn" style="color:#ffc107;min-height:1.2em;"></div>
            <div class="btn-row"><button class="btn red" onclick="restartZone()">重新開始</button></div>`;
        $('hint').innerText = 'W/A/S/D 移動 ｜ Q/E 轉向 ｜ C 蹲低 ｜ 跟著綠色出口標示走';
    }
}
let hudTimer = 0;
function updateHud(dt) {
    if (state.mode !== 'evac' || !fire) return;
    hudTimer += dt;
    if (hudTimer < 0.15) return;
    hudTimer = 0;
    const head = camEl.object3D.position.y;
    $('hTime').innerText = Math.round(fire.t) + ' s';
    $('hLayer').innerText = fire.layer > 50 ? '—' : fire.layer.toFixed(1) + ' m';
    $('hHead').innerText = head.toFixed(1) + ' m' + (state.crouch ? '（蹲低）' : '');
    $('hExpo').innerText = Math.round(fire.exposure) + '%';
    $('hBar').style.width = fire.exposure + '%';
    $('hWarn').innerText = fire.inSmoke ? '⚠️ 你的頭在煙層裡！按 C 蹲低' : (fire.layer - head < 0.6 ? '煙層快到頭部了' : '');
}

window.inspectReport = () => {
    const Z = ZONES[state.zone], pr = progress[state.zone];
    const rows = Z.violations.map(v => `<tr><td class="${pr.found.has(v.id) ? 'ok' : 'ng'}">${pr.found.has(v.id) ? '✔ 已發現' : '✘ 遺漏'}</td><td>${v.name}<br><span class="src">${v.cat}</span></td><td>${v.fix}</td></tr>`).join('');
    showModal(`<h3>📝 公安檢查紀錄表：${Z.name}</h3>
        <p>發現 <b>${pr.found.size}/${Z.violations.length}</b> 項缺失，另檢查了 ${pr.checked.size} 項正常設備。</p>
        <table><tr><th>結果</th><th>缺失項目</th><th>改善方式</th></tr>${rows}</table>
        <p class="src">分類說明：「防火避難設施」屬建築物公共安全檢查申報範圍（如防火門、避難通道、安全梯）；「消防安全設備」屬消防安全設備檢修申報範圍（如滅火器、標示燈、撒水、消防栓）。</p>
        <div class="btn-row"><button class="btn" onclick="closeModal()">關閉</button></div>`);
};

function renderProgress() {
    $('progress').innerHTML = Object.entries(ZONES).map(([k, Z]) => {
        const pr = progress[k];
        const q = Object.keys(pr.quiz).length, qr = Object.entries(pr.quiz).filter(([id, a]) => Z.equipment.find(e => e.id === id).quiz.a === a).length;
        const best = pr.evac.filter(r => r.ok).sort((a, b) => a.exposure - b.exposure)[0];
        return `<div style="margin-bottom:4px;"><b>${k}</b>　導覽 ${pr.visited.size}/${Z.equipment.length}・測驗 ${qr}/${q}・缺失 ${pr.found.size}/${Z.violations.length}・避難 ${best ? '✔' : '—'}</div>`;
    }).join('');
}

$('btnReport').addEventListener('click', () => {
    const rows = [];
    Object.entries(ZONES).forEach(([k, Z]) => {
        const pr = progress[k];
        Z.equipment.forEach(e => rows.push([k, '導覽', e.name, pr.visited.has(e.id) ? '已瀏覽' : '未瀏覽', e.quiz ? (pr.quiz[e.id] == null ? '未作答' : pr.quiz[e.id] === e.quiz.a ? '答對' : '答錯') : '']));
        Z.violations.forEach(v => rows.push([k, '公安檢查', v.name, pr.found.has(v.id) ? '已發現' : '遺漏', v.cat]));
        pr.evac.forEach((r, i) => rows.push([k, '避難體驗', `第 ${i + 1} 次`, r.ok ? `成功（${r.exit}）` : '失敗', `${r.time} 秒／吸入濃煙 ${r.exposure}%`]));
    });
    const table = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    showModal(`<h3>📋 學習紀錄</h3><table><tr><th>區域</th><th>類別</th><th>項目</th><th>結果</th><th>備註</th></tr>${table}</table>
        <div class="btn-row"><button class="btn" id="btnCsv">下載 CSV</button><button class="btn secondary" onclick="closeModal()">關閉</button></div>`);
    $('btnCsv').addEventListener('click', () => {
        const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
        const csv = '﻿' + [['區域', '類別', '項目', '結果', '備註'], ...rows].map(r => r.map(esc).join(',')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = '大巨蛋VR學習紀錄.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    });
});

// ================= 小地圖 =================
const mm = $('minimap'), mctx = mm.getContext('2d');
function drawMinimap() {
    const Z = ZONES[state.zone], [x0, x1, z0, z1] = Z.ext;
    const W = mm.width, H = mm.height;
    const sc = Math.min(W / (x1 - x0), H / (z1 - z0));
    const ox = (W - (x1 - x0) * sc) / 2, oz = (H - (z1 - z0) * sc) / 2;
    const X = x => ox + (x - x0) * sc, Y = z => oz + (z - z0) * sc;
    mctx.fillStyle = '#14141e'; mctx.fillRect(0, 0, W, H);
    mctx.fillStyle = '#5c6b7a';
    solids.forEach(s => { if (s.yb < 1 && s.yt > 0.25 && s.x1 - s.x0 < 60) mctx.fillRect(X(s.x0), Y(s.z0), Math.max(1, (s.x1 - s.x0) * sc), Math.max(1, (s.z1 - s.z0) * sc)); });
    mctx.fillStyle = '#2ecc71';
    Z.exits.forEach(e => { mctx.fillRect(X(e.mm[0]) - 3, Y(e.mm[1]) - 3, 6, 6); });
    if (state.mode === 'tour') {
        Z.equipment.forEach(e => { mctx.fillStyle = progress[state.zone].visited.has(e.id) ? '#777' : '#ffc107'; mctx.beginPath(); mctx.arc(X(e.p[0]), Y(e.p[2]), 2, 0, 7); mctx.fill(); });
    }
    if (fire) { mctx.fillStyle = '#ff5722'; mctx.beginPath(); mctx.arc(X(Z.fire.p[0]), Y(Z.fire.p[2]), 4, 0, 7); mctx.fill(); }
    const p = rigEl.object3D.position, yaw = rigEl.object3D.rotation.y + camEl.object3D.rotation.y;
    const px = X(p.x), py = Y(p.z), fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    mctx.fillStyle = '#4fc3f7';
    mctx.beginPath();
    mctx.moveTo(px + fx * 8, py + fz * 8);
    mctx.lineTo(px - fz * 4 - fx * 3, py + fx * 4 - fz * 3);
    mctx.lineTo(px + fz * 4 - fx * 3, py - fx * 4 - fz * 3);
    mctx.closePath(); mctx.fill();
    mctx.fillStyle = '#aaa'; mctx.font = '10px sans-serif';
    mctx.fillText('■ 出口', 4, H - 4);
}

// ================= 主迴圈 =================
window.gameTick = dt => {
    if (!world.hasLoaded && !sceneEl.hasLoaded) return;
    move(dt);
    updateFire(dt);
    updateHud(dt);
    drawMinimap();
};

document.querySelectorAll('[data-zone]').forEach(b => b.addEventListener('click', () => { state.zone = b.dataset.zone; syncButtons(); buildZone(); }));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; syncButtons(); buildZone(); }));
function syncButtons() {
    document.querySelectorAll('[data-zone]').forEach(b => b.classList.toggle('active', b.dataset.zone === state.zone));
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
}

function init() {
    syncButtons();
    buildZone();
    showModal(`<h3>🏛️ 臺北大巨蛋 VR 公安導覽</h3>
        <p>三個區域（B2 球場層、L1 通道商場、B4 停車場），三種模式：</p>
        <p>🧭 <b>導覽</b>：點擊黃色 ⓘ 熱點認識消防與避難設備，並回答小測驗。<br>
        🔍 <b>公安檢查</b>：扮演檢查員，找出場景中隱藏的違規缺失，完成後產生檢查紀錄表。<br>
        🔥 <b>避難體驗</b>：火災發生！在濃煙下降前，依指示燈找到正確出口。</p>
        <p class="src">＊場景為依一般大型場館配置繪製的教學示意，並非大巨蛋實際平面；標有「📌 查證資料」的內容附有資料來源。電腦：W/A/S/D 移動、拖曳滑鼠看四周；手機：左下角按鈕移動、轉動手機看四周；支援 VR 眼鏡（右下角按鈕）。</p>
        <div class="btn-row"><button class="btn" onclick="closeModal()">開始導覽</button><a class="btn secondary" href="simulate0_guide.html" target="_blank" rel="noopener" style="text-decoration:none">📖 看使用說明</a></div>`);
}
if (sceneEl.hasLoaded) init(); else sceneEl.addEventListener('loaded', init);
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
  <defs>
    <clipPath id="scene"><rect x="25" y="80" width="770" height="590" rx="16"/></clipPath>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#546e7a"/><rect width="7" height="18" fill="#fdd835"/>
    </pattern>
    <g id="foam">
      <rect x="-3" y="0" width="6" height="8" fill="#9e9e9e"/>
      <path d="M-8,8 H8 L5,16 H-5 Z" fill="#bdbdbd" stroke="#616161" stroke-width="1"/>
    </g>
    <g id="extBody">
      <path d="M5,-80 Q26,-72 20,-30" stroke="#212121" stroke-width="4" fill="none"/>
      <rect x="-16" y="-72" width="32" height="72" rx="11" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
      <rect x="-6" y="-86" width="12" height="15" fill="#424242"/>
      <path d="M-4,-86 L18,-93" stroke="#424242" stroke-width="5" stroke-linecap="round"/>
      <rect x="-11" y="-38" width="22" height="24" rx="2" fill="#fff8e1"/>
      <text x="0" y="-22" font-size="9" text-anchor="middle" fill="#333" font-weight="bold">ABC</text>
      <circle cx="0" cy="-56" r="11" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <path d="M-8.7,-51 A10 10 0 0 1 -4.2,-65" stroke="#e53935" stroke-width="3.5" fill="none"/>
      <path d="M-4.2,-65 A10 10 0 0 1 4.2,-65" stroke="#43a047" stroke-width="3.5" fill="none"/>
      <path d="M4.2,-65 A10 10 0 0 1 8.7,-51" stroke="#e53935" stroke-width="3.5" fill="none"/>
    </g>
    <g id="carRear">
      <path d="M14,45 L26,0 H104 L116,45 Z" fill="currentColor" stroke="#263238" stroke-width="2"/>
      <path d="M24,42 L32,8 H98 L106,42 Z" fill="#90caf9" stroke="#263238" stroke-width="1.5"/>
      <rect x="0" y="45" width="130" height="72" rx="14" fill="currentColor" stroke="#263238" stroke-width="2"/>
      <rect x="8" y="58" width="24" height="14" rx="3" fill="#e53935"/>
      <rect x="98" y="58" width="24" height="14" rx="3" fill="#e53935"/>
      <rect x="44" y="78" width="42" height="18" rx="2" fill="#fff" stroke="#263238"/>
      <rect x="4" y="100" width="122" height="10" rx="4" fill="#37474f"/>
      <rect x="6" y="110" width="24" height="22" rx="4" fill="#212121"/>
      <rect x="100" y="110" width="24" height="22" rx="4" fill="#212121"/>
    </g>
  </defs>

  <!-- page -->
  <rect width="960" height="720" fill="#dff3fb"/>

  <!-- header -->
  <text x="40" y="54" font-size="28" font-weight="bold" fill="#222">請圈出「建築物公共安全」的缺失 共六處（不含範例）</text>
  <circle cx="82" cy="44" r="18" fill="none" stroke="#e53935" stroke-width="3"/>

  <!-- corner tag -->
  <path d="M820,0 H960 V125 H885 Q820,125 820,62 Z" fill="#ffeb3b" stroke="#222" stroke-width="3"/>
  <text x="893" y="95" font-size="72" font-weight="bold" text-anchor="middle" fill="#111">10</text>

  <!-- right strip -->
  <rect x="812" y="140" width="54" height="236" rx="27" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>
  <g font-size="34" font-weight="bold" fill="#01579b" text-anchor="middle">
    <text x="839" y="186">地</text><text x="839" y="228">下</text><text x="839" y="270">停</text><text x="839" y="312">車</text><text x="839" y="354">場</text>
  </g>
  <g font-size="60" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="912" y="200">看</text><text x="912" y="272">圖</text><text x="912" y="344">找</text><text x="912" y="416">公</text><text x="912" y="488">安</text><text x="912" y="560">缺</text><text x="912" y="632">失</text>
  </g>
  <circle cx="912" cy="322" r="34" fill="none" stroke="#e53935" stroke-width="4"/>
  <line x1="936" y1="347" x2="956" y2="370" stroke="#e53935" stroke-width="7" stroke-linecap="round"/>

  <!-- scene -->
  <g clip-path="url(#scene)">
    <!-- ceiling / wall / floor -->
    <rect x="25" y="80" width="770" height="48" fill="#78909c"/>
    <rect x="25" y="96" width="770" height="6" fill="#c62828"/>
    <rect x="60" y="112" width="100" height="7" rx="3" fill="#fffde7"/>
    <rect x="300" y="112" width="100" height="7" rx="3" fill="#fffde7"/>
    <rect x="560" y="112" width="100" height="7" rx="3" fill="#fffde7"/>
    <rect x="420" y="82" width="70" height="28" fill="#546e7a" stroke="#37474f"/>
    <g stroke="#37474f" stroke-width="2"><line x1="426" y1="90" x2="484" y2="90"/><line x1="426" y1="97" x2="484" y2="97"/><line x1="426" y1="104" x2="484" y2="104"/></g>
    <use href="#foam" transform="translate(200,102)"/>
    <use href="#foam" transform="translate(360,102)"/>
    <use href="#foam" transform="translate(540,102)"/>
    <use href="#foam" transform="translate(700,102)"/>
    <rect x="25" y="128" width="770" height="345" fill="#b0bec5"/>
    <rect x="25" y="250" width="770" height="4" fill="#a3b1bb"/>
    <rect x="25" y="465" width="770" height="8" fill="#fdd835"/>
    <rect x="25" y="473" width="770" height="197" fill="#5f6f7a"/>
    <g stroke="#eceff1" stroke-width="4">
      <line x1="320" y1="473" x2="300" y2="560"/><line x1="460" y1="473" x2="455" y2="560"/><line x1="600" y1="473" x2="610" y2="560"/>
      <line x1="25" y1="560" x2="795" y2="560"/>
    </g>

    <!-- 安全梯 S1: closed door, lit sign, scooter parked in front -->
    <rect x="40" y="264" width="102" height="209" fill="#78909c"/>
    <rect x="46" y="270" width="90" height="203" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
    <rect x="52" y="370" width="74" height="7" rx="3" fill="#eceff1" stroke="#78909c"/>
    <rect x="54" y="276" width="26" height="7" fill="#37474f"/>
    <rect x="55" y="172" width="72" height="22" fill="#ffffff" stroke="#555"/>
    <text x="91" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">安全梯 S1</text>
    <rect x="41" y="203" width="100" height="46" rx="6" fill="#b9f6ca" opacity="0.8"/>
    <rect x="46" y="208" width="90" height="36" fill="#2e7d32" stroke="#1b5e20"/>
    <rect x="52" y="213" width="15" height="25" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="78" cy="216" r="3" fill="#fff"/>
    <path d="M77,219 L74,228 L69,236 M74,228 L81,235 M76,221 L70,225 M76,221 L83,223" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="110" y="233" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">出口</text>
    <g>
      <circle cx="62" cy="478" r="21" fill="#212121"/><circle cx="62" cy="478" r="8" fill="#9e9e9e"/>
      <circle cx="152" cy="478" r="21" fill="#212121"/><circle cx="152" cy="478" r="8" fill="#9e9e9e"/>
      <path d="M50,470 Q52,428 92,428 L132,428 Q146,436 140,470 Z" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
      <rect x="66" y="414" width="56" height="14" rx="7" fill="#212121"/>
      <line x1="140" y1="470" x2="160" y2="402" stroke="#546e7a" stroke-width="7" stroke-linecap="round"/>
      <line x1="150" y1="400" x2="176" y2="396" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
      <circle cx="166" cy="414" r="7" fill="#fff9c4" stroke="#616161"/>
    </g>

    <!-- column A: direction sign hidden behind cargo -->
    <rect x="195" y="128" width="46" height="345" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
    <rect x="212" y="440" width="62" height="22" fill="#2e7d32"/>
    <text x="243" y="456" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">← 出口</text>
    <g fill="#c8a165" stroke="#8d6e63" stroke-width="2">
      <rect x="180" y="470" width="78" height="8" fill="#8d6e63"/>
      <rect x="182" y="420" width="40" height="50"/><rect x="222" y="426" width="32" height="44"/>
      <rect x="190" y="380" width="42" height="40"/>
    </g>
    <g stroke="#a1887f" stroke-width="3"><line x1="202" y1="420" x2="202" y2="470"/><line x1="211" y1="380" x2="211" y2="420"/><line x1="238" y1="426" x2="238" y2="470"/></g>

    <!-- column B: correct extinguisher + lit direction sign -->
    <rect x="278" y="128" width="46" height="345" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
    <rect x="276" y="292" width="50" height="20" fill="#d32f2f"/>
    <text x="301" y="307" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">滅火器</text>
    <rect x="288" y="330" width="26" height="6" fill="#37474f"/>
    <g transform="translate(301,412)">
      <use href="#extBody"/>
      <line x1="0" y1="-56" x2="0" y2="-65" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-56" r="1.8" fill="#111"/>
    </g>
    <rect x="286" y="408" width="30" height="6" fill="#37474f"/>
    <rect x="266" y="435" width="70" height="28" rx="4" fill="#b9f6ca" opacity="0.8"/>
    <rect x="270" y="439" width="62" height="20" fill="#2e7d32"/>
    <text x="301" y="454" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">← 出口</text>

    <!-- car 1 (normal) -->
    <use href="#carRear" transform="translate(335,355)" color="#ecf0f1"/>

    <!-- hydrant + no-parking hatch + car parked in front -->
    <polygon points="452,473 600,473 616,552 438,552" fill="url(#hatch)" stroke="#fdd835" stroke-width="3"/>
    <circle cx="522" cy="268" r="11" fill="#ff8a80" opacity="0.6"/>
    <circle cx="522" cy="268" r="7" fill="#ff1744" stroke="#b71c1c"/>
    <rect x="487" y="278" width="70" height="150" rx="3" fill="#d32f2f" stroke="#8e0000" stroke-width="2"/>
    <text x="522" y="302" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">消防栓</text>
    <rect x="493" y="310" width="58" height="112" fill="none" stroke="#ff8a80" stroke-width="2"/>
    <use href="#carRear" transform="translate(458,372)" color="#c0392b"/>
    <rect x="474" y="528" width="96" height="22" rx="3" fill="#263238"/>
    <text x="522" y="545" font-size="15" font-weight="bold" text-anchor="middle" fill="#fdd835">禁止停車</text>

    <!-- column C: bracket only, extinguisher missing -->
    <rect x="618" y="128" width="46" height="345" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
    <rect x="616" y="292" width="50" height="20" fill="#d32f2f"/>
    <text x="641" y="307" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">滅火器</text>
    <rect x="628" y="330" width="26" height="6" fill="#37474f"/>
    <rect x="638" y="336" width="6" height="68" fill="#455a64"/>
    <rect x="626" y="404" width="30" height="6" fill="#37474f"/>
    <path d="M626,404 v-8 M656,404 v-8" stroke="#37474f" stroke-width="4"/>

    <!-- 安全梯 S2: door propped open, exit sign dead -->
    <rect x="724" y="264" width="80" height="209" fill="#78909c"/>
    <rect x="730" y="270" width="70" height="203" fill="#37474f"/>
    <path d="M730,473 V445 H752 V415 H774 V385 H796 V473 Z" fill="#607d8b"/>
    <line x1="730" y1="410" x2="800" y2="330" stroke="#b0bec5" stroke-width="4"/>
    <polygon points="730,270 700,256 700,492 730,473" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
    <rect x="705" y="372" width="6" height="20" rx="2" fill="#424242"/>
    <polygon points="684,497 716,497 716,481" fill="#fdd835" stroke="#333" stroke-width="2"/>
    <rect x="730" y="172" width="70" height="22" fill="#ffffff" stroke="#555"/>
    <text x="765" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">安全梯 S2</text>
    <rect x="728" y="208" width="74" height="36" fill="#3e4a44" stroke="#263238"/>
    <rect x="734" y="213" width="15" height="25" fill="none" stroke="#6b7a72" stroke-width="2"/>
    <text x="777" y="233" font-size="16" font-weight="bold" text-anchor="middle" fill="#6b7a72">出口</text>

    <!-- driver walking -->
    <g transform="translate(680,575)">
      <circle cx="0" cy="0" r="13" fill="#ffcc80"/>
      <path d="M-13,-3 Q0,-20 13,-3" fill="#212121"/>
      <rect x="-14" y="15" width="28" height="44" rx="10" fill="#5c6bc0"/>
      <rect x="-11" y="57" width="9" height="32" fill="#37474f"/><rect x="2" y="57" width="9" height="32" fill="#37474f"/>
    </g>

    <!-- example: tires piled in the aisle -->
    <g>
      <ellipse cx="300" cy="632" rx="40" ry="14" fill="#212121"/>
      <rect x="260" y="610" width="80" height="22" fill="#263238"/>
      <ellipse cx="300" cy="610" rx="40" ry="14" fill="#37474f"/><ellipse cx="300" cy="610" rx="18" ry="6" fill="#5f6f7a"/>
      <rect x="262" y="586" width="76" height="22" fill="#263238"/>
      <ellipse cx="300" cy="586" rx="38" ry="13" fill="#37474f"/><ellipse cx="300" cy="586" rx="17" ry="6" fill="#5f6f7a"/>
      <ellipse cx="358" cy="640" rx="34" ry="12" fill="#212121"/>
      <rect x="324" y="620" width="68" height="20" fill="#263238"/>
      <ellipse cx="358" cy="620" rx="34" ry="12" fill="#37474f"/><ellipse cx="358" cy="620" rx="15" ry="5" fill="#5f6f7a"/>
    </g>
  </g>
  <rect x="25" y="80" width="770" height="590" rx="16" fill="none" stroke="#90a4ae" stroke-width="3"/>

  <!-- example circle -->
  <circle cx="325" cy="612" r="58" fill="none" stroke="#e53935" stroke-width="2"/>
  <rect x="390" y="590" width="200" height="30" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#9e9e9e"/>
  <text x="399" y="611" font-size="17" font-weight="bold" fill="#222">範例：通道上堆放輪胎</text>

  <text x="40" y="700" font-size="14" fill="#546e7a">示意圖：地下四樓停車場（建築物公共安全檢查）</text>
</svg>

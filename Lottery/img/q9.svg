      <rect x="262" y="458" width="90" height="5" fill="#8d6e63"/>
      <rect x="262" y="496" width="90" height="5" fill="#8d6e63"/>
      <rect x="272" y="402" width="16" height="18" rx="3" fill="#42a5f5"/><rect x="294" y="406" width="20" height="14" rx="3" fill="#ef5350"/><rect x="320" y="400" width="20" height="20" rx="3" fill="#66bb6a"/>
      <rect x="270" y="442" width="24" height="16" rx="3" fill="#ab47bc"/><rect x="300" y="438" width="18" height="20" rx="3" fill="#ffa726"/><rect x="324" y="444" width="18" height="14" rx="3" fill="#26c6da"/>
      <rect x="272" y="480" width="20" height="16" rx="3" fill="#ec407a"/><rect x="298" y="478" width="22" height="18" rx="3" fill="#8d6e63"/><rect x="326" y="482" width="16" height="14" rx="3" fill="#5c6bc0"/>

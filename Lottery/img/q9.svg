    <rect x="732" y="290" width="70" height="210" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
    <rect x="732" y="208" width="66" height="22" fill="#ffffff" stroke="#555"/>
    <text x="765" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">安全梯 S2</text>
    <rect x="727" y="235" width="68" height="44" rx="6" fill="#a5d6a7" opacity="0.7"/>
    <rect x="732" y="240" width="58" height="34" fill="#2e7d32" stroke="#1b5e20"/>
    <text x="761" y="263" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">出口</text>
    <g fill="#c8a165" stroke="#8d6e63" stroke-width="2">
      <rect x="722" y="450" width="44" height="54"/><rect x="766" y="452" width="40" height="52"/>
      <rect x="730" y="400" width="44" height="50"/><rect x="772" y="410" width="34" height="42"/>
      <rect x="740" y="356" width="40" height="44"/>
    </g>
    <g stroke="#a1887f" stroke-width="3">
      <line x1="744" y1="450" x2="744" y2="504"/><line x1="786" y1="452" x2="786" y2="504"/><line x1="752" y1="400" x2="752" y2="450"/><line x1="760" y1="356" x2="760" y2="400"/>
    </g>


      <line x1="0" y1="-56" x2="-8" y2="-52" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-56" r="1.8" fill="#111"/>
    </g>

    <!-- direction sign (lit, correct) -->

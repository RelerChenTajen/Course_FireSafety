    <path d="M83,251 L80,260 L75,268 M80,260 L87,267 M82,253 L76,257 M82,253 L89,255" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="114" y="264" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">出口</text>


  <circle cx="82" cy="44" r="18" fill="none" stroke="#e53935" stroke-width="3"/>

  <!-- corner tag -->
  <path d="M820,0 H960 V125 H885 Q820,125 820,62 Z" fill="#ffeb3b" stroke="#222" stroke-width="3"/>
  <text x="895" y="98" font-size="82" font-weight="bold" text-anchor="middle" fill="#111">9</text>

  <!-- right strip -->
  <rect x="812" y="160" width="54" height="196" rx="27" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>

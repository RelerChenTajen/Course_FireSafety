    <rect x="215" y="140" width="165" height="28" fill="#90a4ae" stroke="#607d8b" stroke-width="2"/>
    <line x1="220" y1="149" x2="375" y2="149" stroke="#607d8b"/><line x1="220" y1="158" x2="375" y2="158" stroke="#607d8b"/>
    <rect x="225" y="168" width="145" height="332" fill="#f4ead9"/>
    <polygon points="225,500 370,500 330,420 265,420" fill="#e9dfd5"/>
    <rect x="262" y="250" width="72" height="110" fill="#ffe0b2" stroke="#d7b98e"/>

    <circle cx="655" cy="290" r="7" fill="#ff1744" stroke="#b71c1c"/>
    <rect x="620" y="300" width="70" height="156" rx="3" fill="#d32f2f" stroke="#8e0000" stroke-width="2"/>
    <text x="655" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">消防栓</text>
    <rect x="626" y="332" width="58" height="118" fill="none" stroke="#ff8a80" stroke-width="2"/>
    <line x1="618" y1="505" x2="634" y2="382" stroke="#5d4037" stroke-width="5"/>
    <line x1="692" y1="505" x2="676" y2="382" stroke="#5d4037" stroke-width="5"/>
    <polygon points="610,500 628,375 682,375 700,500" fill="#fff3e0" stroke="#5d4037" stroke-width="4"/>
    <text x="655" y="425" font-size="17" font-weight="bold" text-anchor="middle" fill="#d84315">新品</text>
    <text x="655" y="447" font-size="17" font-weight="bold" text-anchor="middle" fill="#d84315">上市</text>
    <text x="655" y="474" font-size="13" text-anchor="middle" fill="#5d4037">滿千送百</text>

    <!-- 安全梯 S2 with boxes stacked -->

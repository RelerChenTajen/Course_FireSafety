      <rect x="-15" y="16" width="30" height="48" rx="10" fill="#26a69a"/>
      <rect x="-12" y="62" width="9" height="36" fill="#37474f"/><rect x="3" y="62" width="9" height="36" fill="#37474f"/>
      <rect x="16" y="40" width="20" height="24" rx="2" fill="#ffb300"/>
      <path d="M21,40 Q26,30 31,40" stroke="#6d4c41" stroke-width="2" fill="none"/>
    </g>

    <!-- example: trolley in the corridor -->
    <g>
      <rect x="250" y="610" width="104" height="10" rx="2" fill="#546e7a"/>
      <circle cx="264" cy="630" r="9" fill="#263238"/><circle cx="340" cy="630" r="9" fill="#263238"/>
      <line x1="352" y1="612" x2="366" y2="545" stroke="#546e7a" stroke-width="6" stroke-linecap="round"/>

  </g>
  <rect x="25" y="80" width="770" height="590" rx="16" fill="none" stroke="#90a4ae" stroke-width="3"/>

  <!-- example circle -->
  <circle cx="306" cy="590" r="62" fill="none" stroke="#e53935" stroke-width="2"/>
  <rect x="374" y="582" width="226" height="30" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#9e9e9e"/>
  <text x="383" y="603" font-size="17" font-weight="bold" fill="#222">範例：逃生通道上放置推車</text>

  <text x="40" y="700" font-size="14" fill="#546e7a">示意圖：商場一樓通道（建築物公共安全檢查）</text>
</svg>

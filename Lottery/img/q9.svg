    <rect x="70" y="92" width="90" height="9" rx="3" fill="#fffde7" stroke="#cfd8dc"/>
    <rect x="300" y="92" width="90" height="9" rx="3" fill="#fffde7" stroke="#cfd8dc"/>
    <rect x="640" y="92" width="90" height="9" rx="3" fill="#fffde7" stroke="#cfd8dc"/>

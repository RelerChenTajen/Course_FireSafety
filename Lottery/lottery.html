<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../platform.css?v=3">
    <meta name="author" content="熊仔其人">
    <title>職業安全問答轉盤</title>
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/lottery.css">
</head>
<body>
<div class="pbar">
    <a class="pb-home" href="../index.html">🏠 平台首頁</a>
    <span class="pb-sep g">›</span><span class="pb-group g1">教育互動推廣</span>
    <span class="pb-sep">›</span><span class="pb-page">職業安全問答轉盤</span>
    <span class="pb-right"><a class="pb-btn" href="lottery_guide.html" target="_blank" rel="noopener">📖 使用說明</a></span>
</div>
    <header class="topbar">
        <h1>職業安全問答轉盤</h1>
        <div class="top-tools">
            <button type="button" class="icon-btn" id="btnSound" title="音效開關">🔊</button>
            <button type="button" class="icon-btn" id="btnFull" title="全螢幕（F）">⛶</button>
        </div>
    </header>

    <div class="layout">
        <main>
            <p class="turn">輪到 <b id="turnName">第1組</b></p>
            <div class="wheel-wrap" id="wheelWrap">
                <canvas id="wheel" aria-label="題目轉盤"></canvas>
                <div class="pointer" aria-hidden="true"></div>
                <button class="spin" id="btnSpin" type="button">開始</button>
            </div>
            <p class="hint">按「開始」或<kbd>空白鍵</kbd>轉動・灰色是已經抽過的題目</p>
        </main>

        <aside class="panel">
            <section>
                <h2>🏆 計分板</h2>
                <ol class="teams" id="teams"></ol>
                <p class="small">點組名可以改名；點 ▶ 指定輪到哪一組。</p>
            </section>
            <section>
                <h2>⚙️ 設定</h2>
                <div class="setting">
                    <label for="teamCount">組數</label>
                    <input type="number" id="teamCount" min="1" max="8">
                </div>
                <div class="setting">
                    <label for="seconds">作答時間</label>
                    <select id="seconds">
                        <option value="60">60 秒</option>
                        <option value="90">90 秒</option>
                        <option value="120">120 秒</option>
                        <option value="180">180 秒</option>
                        <option value="0">不計時</option>
                    </select>
                </div>
                <div class="setting pools">
                    <span>題庫</span>
                    <label><input type="checkbox" id="poolOsh"> 職業安全</label>
                    <label><input type="checkbox" id="poolPub"> 建築物公共安全</label>
                </div>
                <p class="small" id="usedInfo"></p>
                <div class="row">
                    <button type="button" class="btn" id="btnResetUsed">重新抽題</button>
                    <button type="button" class="btn" id="btnResetScore">分數歸零</button>
                </div>
            </section>
        </aside>
    </div>

    <div class="modal" id="modal" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="resultName">
            <p class="eyebrow" id="resultTeam">第1組抽到的是</p>
            <h2 id="resultName">—</h2>
            <p id="resultInfo"></p>
            <div class="actions">
                <a class="btn primary" id="btnGo" href="#">開始作答 →</a>
                <button class="btn" id="btnAgain" type="button">再轉一次</button>
            </div>
        </div>
    </div>

    <div class="modal" id="allDone" hidden>
        <div class="card" role="dialog" aria-modal="true">
            <h2>🎉 題目都抽完了</h2>
            <p id="finalRank"></p>
            <div class="actions">
                <button class="btn primary" id="btnRestart" type="button">重新抽題</button>
                <button class="btn" type="button" data-close>關閉</button>
            </div>
        </div>
    </div>

    <script src="js/topics.js"></script>
    <script src="js/hazards.js"></script>
    <script src="js/hazards-public.js"></script>
    <script src="js/game.js"></script>
    <script src="js/lottery.js"></script>
</body>
</html>

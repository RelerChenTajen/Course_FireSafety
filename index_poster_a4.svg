<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1000 1414" font-family="'Microsoft JhengHei','Heiti TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .gTitle  { font-size: 25px; font-weight: bold; fill: #f1f5f9; }
      .gDesc   { font-size: 13px; fill: #94a3b8; }
      .cTitle  { font-size: 18px; font-weight: bold; fill: #f1f5f9; }
      .cText   { font-size: 13px; fill: #94a3b8; }
      .cLink   { font-size: 12px; fill: #38bdf8; font-family: monospace; }
      .tag     { font-size: 11px; fill: #cbd5e1; }
    </style>

    <!-- 向量圖示（無 emoji，列印相容） -->
    <symbol id="ic-flame" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M12 2 c2 4 5 5 5 9 a5 5 0 0 1 -10 0 c0 -2 1 -3 2 -4 c0 2 1 2 2 2 c0 -3 -2 -4 -1 -7 z"/>
    </symbol>
    <symbol id="ic-wheel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"/><line x1="12" y1="5" x2="12" y2="21"/><line x1="4" y1="13" x2="20" y2="13"/>
      <path d="M12 1 l3 5 h-6 z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="5" y1="20" x2="5" y2="13"/><line x1="12" y1="20" x2="12" y2="7"/><line x1="19" y1="20" x2="19" y2="11"/><line x1="3" y1="20" x2="21" y2="20"/>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="3.5" y="11" width="7" height="7"/><rect x="13.5" y="11" width="7" height="7"/><rect x="8.5" y="4" width="7" height="7"/>
    </symbol>
    <symbol id="ic-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M9 4 h6 v5 h5 v6 h-5 v5 h-6 v-5 h-5 v-6 h5 z"/>
    </symbol>
    <symbol id="ic-vr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="10" rx="3"/><circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="12" r="2.2"/>
    </symbol>
    <symbol id="ic-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19 q0 -6 7 -6 q7 0 7 -6"/><circle cx="5" cy="19" r="2" fill="currentColor" stroke="none"/>
      <path d="M19 3 l3 5 h-6 z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-crowd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="8" r="2.5"/><path d="M3 19 v-1 a4 4 0 0 1 8 0 v1"/>
      <circle cx="17" cy="8" r="2.5"/><path d="M13 19 v-1 a4 4 0 0 1 8 0 v1"/>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="1414" fill="#0f172a"/>

  <!-- 頁首 -->
  <rect width="1000" height="208" fill="url(#headerGrad)"/>
  <rect y="205" width="1000" height="3" fill="#38bdf8"/>
  <rect x="60" y="58" width="64" height="64" rx="14" fill="#38bdf8" opacity="0.16"/>
  <use href="#ic-flame" x="74" y="72" width="36" height="36" color="#38bdf8"/>
  <text x="142" y="104" font-size="32" font-weight="bold" fill="#f1f5f9">消防與公共安全模擬教學平台</text>
  <text x="144" y="142" font-size="15" fill="#94a3b8">互動式教學 ・ AIoT 偵測模擬 ・ 大型場館公安演示</text>

  <!-- ===== 類群 1：教育互動推廣 ===== -->
  <rect x="60" y="250" width="8" height="34" rx="4" fill="#f97316"/>
  <text x="82" y="271" class="gTitle">消防與職業安全教育互動推廣</text>
  <text x="82" y="294" class="gDesc">以互動遊戲化方式推廣職業安全與消防防災觀念</text>

  <g>
    <rect x="60" y="312" width="880" height="200" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="72" y="324" width="6" height="176" rx="3" fill="#f97316"/>
    <rect x="92" y="340" width="46" height="46" rx="10" fill="#f97316" opacity="0.16"/>
    <use href="#ic-wheel" x="103" y="351" width="24" height="24" color="#f97316"/>
    <text x="156" y="372" class="cTitle">職業安全問答轉盤</text>
    <text x="156" y="402" class="cText">點擊指針旋轉抽選產業別（營造、餐飲、堆高機、航空、物流、工廠、醫療、螺絲產業），</text>
    <text x="156" y="424" class="cText">帶出對應職安問答情境，以遊戲化方式寓教於樂。</text>
    <rect x="156" y="442" width="78" height="22" rx="11" fill="#ffffff14"/><text x="195" y="457" class="tag" text-anchor="middle">互動抽獎</text>
    <rect x="242" y="442" width="78" height="22" rx="11" fill="#ffffff14"/><text x="281" y="457" class="tag" text-anchor="middle">職安教育</text>
    <text x="916" y="457" class="cLink" text-anchor="end">Lottery/lottery.html</text>
  </g>

  <!-- ===== 類群 2：AIoT 消防偵測系列 ===== -->
  <rect x="60" y="556" width="8" height="34" rx="4" fill="#e74c3c"/>
  <text x="82" y="577" class="gTitle">AIoT 消防偵測系列</text>
  <text x="82" y="600" class="gDesc">感測數據 × AI 判斷 × 即時警報的智慧防災情境模擬</text>

  <g>
    <!-- aiot -->
    <rect x="60" y="618" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="72" y="630" width="6" height="266" rx="3" fill="#e74c3c"/>
    <rect x="88" y="642" width="46" height="46" rx="10" fill="#e74c3c" opacity="0.16"/>
    <use href="#ic-chart" x="99" y="653" width="24" height="24" color="#e74c3c"/>
    <text x="90" y="728" class="cTitle">AIoT 消防安全教學網</text>
    <text x="90" y="762" class="cText">Arduino × Node-RED 教學專</text>
    <text x="90" y="784" class="cText">題，滑桿模擬溫度/煙霧/CO，</text>
    <text x="90" y="806" class="cText">即時觸發火災警報與趨勢圖。</text>
    <rect x="90"  y="850" width="56" height="22" rx="11" fill="#ffffff14"/><text x="118" y="865" class="tag" text-anchor="middle">教學</text>
    <rect x="154" y="850" width="70" height="22" rx="11" fill="#ffffff14"/><text x="189" y="865" class="tag" text-anchor="middle">Chart.js</text>
    <text x="90" y="898" class="cLink">aiot.html</text>

    <!-- warehouse -->
    <rect x="360" y="618" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="372" y="630" width="6" height="266" rx="3" fill="#e74c3c"/>
    <rect x="388" y="642" width="46" height="46" rx="10" fill="#e74c3c" opacity="0.16"/>
    <use href="#ic-box" x="399" y="653" width="24" height="24" color="#e74c3c"/>
    <text x="390" y="728" class="cTitle">智慧倉儲火警偵測</text>
    <text x="390" y="762" class="cText">大空間倉儲戰情室：熱影像</text>
    <text x="390" y="784" class="cText">＋AI 升溫速率核心，模擬貨架</text>
    <text x="390" y="806" class="cText">急速升溫的警報與閃爍定位。</text>
    <rect x="390" y="850" width="56" height="22" rx="11" fill="#ffffff14"/><text x="418" y="865" class="tag" text-anchor="middle">熱影像</text>
    <rect x="454" y="850" width="70" height="22" rx="11" fill="#ffffff14"/><text x="489" y="865" class="tag" text-anchor="middle">升溫 AI</text>
    <text x="390" y="898" class="cLink">warehouse_aiot.html</text>

    <!-- hospital -->
    <rect x="660" y="618" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="672" y="630" width="6" height="266" rx="3" fill="#e74c3c"/>
    <rect x="688" y="642" width="46" height="46" rx="10" fill="#e74c3c" opacity="0.16"/>
    <use href="#ic-cross" x="699" y="653" width="24" height="24" color="#e74c3c"/>
    <text x="690" y="728" class="cTitle">醫院智慧消防監測</text>
    <text x="690" y="762" class="cText">同步監測病房陰燃、氧氣室</text>
    <text x="690" y="784" class="cText">高溫、ICU 設備過熱，提供</text>
    <text x="690" y="806" class="cText">三種危險情境與即時日誌。</text>
    <rect x="690" y="850" width="70" height="22" rx="11" fill="#ffffff14"/><text x="725" y="865" class="tag" text-anchor="middle">多區監測</text>
    <rect x="768" y="850" width="56" height="22" rx="11" fill="#ffffff14"/><text x="796" y="865" class="tag" text-anchor="middle">純前端</text>
    <text x="690" y="898" class="cLink">hospital-aiot.html</text>
  </g>

  <!-- ===== 類群 3：臺北大巨蛋公安模擬系列 ===== -->
  <rect x="60" y="952" width="8" height="34" rx="4" fill="#06b6d4"/>
  <text x="82" y="973" class="gTitle">臺北大巨蛋公安模擬系列</text>
  <text x="82" y="996" class="gDesc">以三種視覺技術呈現大型場館的防災、避難與群眾安全</text>

  <g>
    <!-- simulate0 -->
    <rect x="60" y="1014" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="72" y="1026" width="6" height="266" rx="3" fill="#06b6d4"/>
    <rect x="88" y="1038" width="46" height="46" rx="10" fill="#06b6d4" opacity="0.16"/>
    <use href="#ic-vr" x="99" y="1049" width="24" height="24" color="#06b6d4"/>
    <text x="90" y="1124" class="cTitle">360° VR 防災導覽</text>
    <text x="90" y="1158" class="cText">A-Frame 全景導覽，可切換</text>
    <text x="90" y="1180" class="cText">球場/通道/停車場，點擊熱點</text>
    <text x="90" y="1202" class="cText">查看排煙、防火捲門等說明。</text>
    <rect x="90"  y="1246" width="92" height="22" rx="11" fill="#ffffff14"/><text x="136" y="1261" class="tag" text-anchor="middle">VR / A-Frame</text>
    <rect x="190" y="1246" width="70" height="22" rx="11" fill="#ffffff14"/><text x="225" y="1261" class="tag" text-anchor="middle">熱點互動</text>
    <text x="90" y="1294" class="cLink">simulate0.html</text>

    <!-- simulate1 -->
    <rect x="360" y="1014" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="372" y="1026" width="6" height="266" rx="3" fill="#06b6d4"/>
    <rect x="388" y="1038" width="46" height="46" rx="10" fill="#06b6d4" opacity="0.16"/>
    <use href="#ic-route" x="399" y="1049" width="24" height="24" color="#06b6d4"/>
    <text x="390" y="1124" class="cTitle">疏散動線示意圖</text>
    <text x="390" y="1158" class="cText">SVG 俯視圖呈現看台分層、</text>
    <text x="390" y="1180" class="cText">樓梯核與出口，搭配低/中/高</text>
    <text x="390" y="1202" class="cText">層三種疏散策略與流動動畫。</text>
    <rect x="390" y="1246" width="72" height="22" rx="11" fill="#ffffff14"/><text x="426" y="1261" class="tag" text-anchor="middle">SVG 動畫</text>
    <rect x="470" y="1246" width="72" height="22" rx="11" fill="#ffffff14"/><text x="506" y="1261" class="tag" text-anchor="middle">疏散策略</text>
    <text x="390" y="1294" class="cLink">simulate1.html</text>

    <!-- simulate2 -->
    <rect x="660" y="1014" width="280" height="290" rx="12" fill="#243349" stroke="#334155"/>
    <rect x="672" y="1026" width="6" height="266" rx="3" fill="#06b6d4"/>
    <rect x="688" y="1038" width="46" height="46" rx="10" fill="#06b6d4" opacity="0.16"/>
    <use href="#ic-crowd" x="699" y="1049" width="24" height="24" color="#06b6d4"/>
    <text x="690" y="1124" class="cTitle">大規模集客模擬</text>
    <text x="690" y="1158" class="cText">Canvas 粒子模擬 4 萬人入座</text>
    <text x="690" y="1180" class="cText">與疏散，即時顯示場內人數、</text>
    <text x="690" y="1202" class="cText">密度與流率。</text>
    <rect x="690" y="1246" width="92" height="22" rx="11" fill="#ffffff14"/><text x="736" y="1261" class="tag" text-anchor="middle">Canvas 粒子</text>
    <rect x="790" y="1246" width="70" height="22" rx="11" fill="#ffffff14"/><text x="825" y="1261" class="tag" text-anchor="middle">群眾密度</text>
    <text x="690" y="1294" class="cLink">simulate2.html</text>
  </g>

  <!-- 頁尾 -->
  <line x1="60" y1="1356" x2="940" y2="1356" stroke="#1e293b"/>
  <text x="500" y="1382" text-anchor="middle" font-size="12" fill="#64748b">消防與公共安全模擬教學平台 ｜ 教學示範用途 ｜ Designed for Educational Purpose</text>
</svg>
